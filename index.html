<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>Algo Levels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="levels.js?v=7"></script>
<style>
:root{
  --bg:#07080a; --panel:#0d0f12; --panel2:#12151a; --line:#1b1f26; --line2:#262b33;
  --text:#e6e8eb; --muted:#6b7280; --dim:#3f4550;
  --short:#f05a6e; --long:#2fc59f; --gold:#c9a66b; --zg:#e3b341;
  --call:#5fb3c6; --put:#c77dba; --vol:#8fa3d9; --vp:#9aa0a8; --qqq:#c9a66b;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--mono);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(7,8,10,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--sans);font-weight:700;letter-spacing:.18em;font-size:13px}
.brand span{color:var(--muted);font-weight:500;margin-left:6px}
.quote{margin-left:auto;display:flex;align-items:center;gap:8px}
#px{font-size:16px;font-weight:700}
.badge{font-size:11px;padding:3px 7px;border:1px solid var(--line2);border-radius:4px;color:var(--muted)}
.badge.pos{color:var(--long);border-color:rgba(47,197,159,.35)}
.badge.neg{color:var(--short);border-color:rgba(240,90,110,.35)}
#gear{width:34px;height:34px;border:1px solid var(--line2);border-radius:6px;font-size:15px}
#help{width:34px;height:34px;border:1px solid var(--line2);border-radius:6px;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none;font-family:var(--mono)}

.meta{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 16px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.meta b{color:var(--text);font-weight:500}
.dotlive{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dim);margin-right:5px;vertical-align:middle}
.dotlive.ok{background:var(--long)} .dotlive.err{background:var(--short)}

#chart{height:46dvh;min-height:280px;border-bottom:1px solid var(--line)}

.majors{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12px}
.majors:empty{display:none}
.mj{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--panel)}
.mj b{font-weight:700}
.mj .t{font-size:10px;letter-spacing:.08em;padding:2px 5px;border-radius:3px}
.mj.cw .t{background:rgba(95,179,198,.15);color:var(--call)} .mj.pw .t{background:rgba(199,125,186,.15);color:var(--put)}
.mj .z{font-size:11px;color:var(--muted)}
.mj.weak{border-color:rgba(201,166,107,.6)} .mj.weak .z{color:var(--gold)}
.mj.strong{border-color:var(--gold);background:#1d1709;animation:pulse 1.2s infinite} .mj.strong .z{color:var(--gold);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px}
#bTV{margin-left:auto;color:var(--gold);border-color:rgba(201,166,107,.4)}
.tabs button{font-size:12px;padding:6px 10px;border:1px solid var(--line2);border-radius:6px;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--text)}

#list{padding:0 0 24px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:active{background:var(--panel)}
.row.near{background:linear-gradient(90deg,rgba(201,166,107,.08),transparent)}
.row .p{font-size:15px;font-weight:500;align-self:center}
.row .chips{display:flex;flex-wrap:wrap;gap:5px;align-self:center}
.row .sc{align-self:center;font-size:12px;color:var(--muted);text-align:right}
.row .sc b{color:var(--text);font-size:14px}
.row .dir{font-size:12px}
.row .dir.s{color:var(--short)} .row .dir.l{color:var(--long)} .row .dir.a{color:var(--gold)}
.row .dist{font-size:12px;color:var(--muted)}
.row .st{font-size:12px;color:var(--muted);text-align:right}
.st i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--dim);vertical-align:middle}
.st.reacted i{background:var(--gold)} .st.broken i{background:var(--short)} .st.testing i{background:var(--long);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.row .more{grid-column:1/-1;display:none;font-size:11px;color:var(--muted);line-height:1.7}
.row.open .more{display:block}
.chip{font-size:11px;padding:3px 6px;border:1px solid var(--line2);border-radius:3px;color:var(--muted);white-space:nowrap}
.chip.call{color:var(--call)} .chip.put{color:var(--put)} .chip.zg{color:var(--zg)}
.chip.vol{color:var(--vol)} .chip.vp{color:var(--vp)} .chip.qqq{color:var(--qqq)} .chip.chg{color:#e7895a}
.pxrow{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:12px;color:var(--gold);border-bottom:1px solid var(--line)}
.pxrow::before,.pxrow::after{content:"";flex:1;height:1px;background:rgba(201,166,107,.35)}
.prevhd{padding:22px 16px 8px;font-size:11px;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--line);text-transform:uppercase}
.prevhd span{display:block;margin-top:4px;text-transform:none;letter-spacing:0;color:var(--dim)}
.row.prev{cursor:default;opacity:.62}
.row.prev .p{font-size:14px}
.pxrow.dim{color:var(--muted);opacity:.6}
.empty{padding:28px 16px;color:var(--muted);font-size:13px;line-height:1.6}
.empty button{margin-top:12px;padding:8px 12px;border:1px solid var(--line2);border-radius:6px;color:var(--text)}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .box{width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:var(--panel);border:1px solid var(--line2);
  border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.box h3{font-family:var(--sans);font-size:14px;letter-spacing:.08em;margin-bottom:12px}
.box h4{font-size:11px;color:var(--muted);letter-spacing:.1em;margin:16px 0 8px}
.f{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.f.full{grid-template-columns:1fr}
.f input[type=text],.f input[type=password],.f input[type=number]{width:100%;background:var(--bg);color:var(--text);
  border:1px solid var(--line2);border-radius:6px;padding:8px;font:inherit;font-size:13px}
.cb{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:8px}
.cb input{accent-color:var(--gold);width:16px;height:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btns button{padding:9px 12px;border:1px solid var(--line2);border-radius:6px;font-size:12px}
.btns .pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);
  background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:10px 14px;border-radius:8px;font-size:12px;
  transition:transform .25s;z-index:30;max-width:92vw;visibility:hidden}
#toast.major{border-color:var(--gold);background:#1d1709;color:#f3d9a4;font-weight:700}
#toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
</style>
</head>
<body>
<header>
  <div class="brand">ALGO<span>LEVELS</span></div>
  <div class="quote"><span id="px">—</span><span id="regime" class="badge">γ —</span></div>
  <a id="help" href="guide.html" aria-label="Jak to funguje">?</a>
  <button id="gear" aria-label="Nastavení">⚙</button>
</header>
<div class="meta">
  <span id="src" class="badge">—</span>
  <span><i id="live" class="dotlive"></i><span id="upd">čekám na data</span></span>
  <span>EM <b id="mEm">—</b></span>
  <span>σ <b id="mSig">—</b></span>
  <span>pPOC <b id="mPoc">—</b></span>
  <span>QQQ×<b id="mRatio">—</b></span>
</div>
<div id="majors" class="majors"></div>
<div id="chart"></div>
<div class="tabs">
  <button data-f="all" class="on">Vše</button>
  <button data-f="near">±100 b.</button>
  <button data-f="opt">Jen s options</button>
  <button data-f="fresh">Untested</button>
  <button id="bTV">⧉ TradingView</button>
</div>
<div id="list"></div>

<div id="settings" class="sheet"><div class="box">
  <h3>NASTAVENÍ</h3>
  <h4>PŘIPOJENÍ</h4>
  <div class="f full"><input id="sWorker" type="text" placeholder="https://algo-levels.xxx.workers.dev" autocomplete="off"></div>
  <div class="f full"><input id="sToken" type="password" placeholder="ACCESS_TOKEN" autocomplete="off"></div>
  <h4>CONFLUENCE</h4>
  <div class="grid2">
    <div class="f"><label>Cluster tol. (b.)</label><input id="sTol" type="number" step="1"></div>
    <div class="f"><label>Min skóre</label><input id="sMin" type="number" step="0.5"></div>
    <div class="f"><label>Rozsah (± %)</label><input id="sRange" type="number" step="0.5"></div>
  </div>
  <h4>STAV LEVELU</h4>
  <div class="grid2">
    <div class="f"><label>Touch (b.)</label><input id="sTouch" type="number" step="0.5"></div>
    <div class="f"><label>Break close (b.)</label><input id="sBrk" type="number" step="0.5"></div>
    <div class="f"><label>Reakce (b.)</label><input id="sReact" type="number" step="1"></div>
    <div class="f"><label>Lookahead (bary)</label><input id="sLook" type="number" step="1"></div>
  </div>
  <label class="cb"><input id="sRTH" type="checkbox"> Status počítat jen z RTH (jinak celý Globex den)</label>
  <label class="cb"><input id="sPrev" type="checkbox"> Ukazovat včerejší levely (šedě, jen orientace)</label>
  <h4>EXPECTED MOVE</h4>
  <div class="f"><label>Volatility index</label>
    <select id="sVol" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:8px;font:inherit;font-size:13px">
      <option value="VXN">VXN (NQ)</option><option value="VIX">VIX (ES)</option></select></div>
  <label class="cb"><input id="sStr" type="checkbox"> Převést σ na straddle EM (×0.8)</label>
  <h4>ALERTY</h4>
  <label class="cb"><input id="sMA" type="checkbox"> ★ Vždy alert u největší QQQ call/put wall (strike 0/5) – slabá ±0.5 QQQ, silná ±N b.</label>
  <div class="grid2">
    <div class="f"><label>Vzdálenost (b.)</label><input id="sAD" type="number" step="1"></div>
    <div class="f"><label>Min skóre</label><input id="sAS" type="number" step="0.5"></div>
    <div class="f"><label>Silná zóna (b.)</label><input id="sMS" type="number" step="1"></div>
  </div>
  <h4>VRSTVY</h4>
  <div class="grid2" id="layers"></div>
  <div class="btns">
    <button class="pri" id="bSave">Uložit</button>
    <button id="bAlerts">Zapnout alerty</button>
    <button id="bDemo">Demo data</button>
    <button id="bClose">Zavřít</button>
  </div>
  <p class="hint">Klíč GEXbot je jen ve Workeru. Tady se ukládá URL Workeru a access token (v tomto prohlížeči).</p>
</div></div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const A = window.AlgoLevels;
const LAYERS = [
  ['gex0','0DTE GEX'],['gex1','1DTE GEX'],['gexFull','Full chain GEX'],['maxchg','ΔGEX 15m'],
  ['qqq','QQQ walls (0/5)'],['qqqMain','QQQ 0/5 levely'],['em','EM (VXN/VIX)'],['sigma','σ Grid'],['vp','Prev VP']
];
const DEF = { worker:'', token:'', tol:10, minScore:3, range:3, touch:3, brk:6, react:15, lookahead:15,
  scanRTH:true, alertDist:8, alertScore:4, showPrev:true, volIndex:'VXN', emStraddle:true, majorAlerts:true, majorStrong:10, layers:Object.fromEntries(LAYERS.map(l=>[l[0],true])) };

// ───────── settings (localStorage may be unavailable)
function load(){ try{ const s=JSON.parse(localStorage.getItem('algoLevels.v1')||'{}');
  return {...DEF,...s,layers:{...DEF.layers,...(s.layers||{})}}; }catch(e){ return structuredClone(DEF); } }
function save(){ try{ localStorage.setItem('algoLevels.v1', JSON.stringify(S)); }catch(e){} }
const S = load();

const st = { data:{bars:[],daily:[],vix:[],gex:{}}, res:null, demo:false, tick:0, lines:[], alerted:{}, majorZone:{}, filter:'all',
  audio:null, open:new Set(), busy:false, yf:[], live:new Map(), liveSrc:null, liveAge:NaN, basis:NaN, liveBusy:false };
const $ = id => document.getElementById(id);
const fmtP = n => Number.isFinite(n) ? n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';

// ───────── chart
const chart = LightweightCharts.createChart($('chart'), {
  autoSize:true,
  localization:{ locale:'en-US' },
  layout:{ background:{type:'solid',color:'#07080a'}, textColor:'#7b828c', fontFamily:'JetBrains Mono', fontSize:11 },
  grid:{ vertLines:{color:'#0f1216'}, horzLines:{color:'#0f1216'} },
  rightPriceScale:{ borderColor:'#1b1f26' },
  timeScale:{ borderColor:'#1b1f26', timeVisible:true, secondsVisible:false, rightOffset:8 },
  crosshair:{ mode:0 },
});
const series = chart.addCandlestickSeries({
  upColor:'#e6e8eb', downColor:'#4a505a', borderVisible:false, wickUpColor:'#9ca3af', wickDownColor:'#4a505a',
});
let fitted = false;

// ───────── data
async function api(path){
  const base = S.worker.trim().replace(/\/$/,'');
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(base + path + (S.token ? sep + 't=' + encodeURIComponent(S.token) : ''), {cache:'no-store'});
  if (!r.ok) throw new Error(`${path.split('?')[0]} → ${r.status}`);
  return r.json();
}
// ───────── bars = Yahoo history (delayed) + live 1m candles built from GEXbot spot
async function loadBars(){ st.yf = A.parseYF(await api('/yf/NQ%3DF?interval=1m&range=5d')); mergeBars(); }
function mergeBars(){
  const yf = st.yf || [];
  const yfLast = yf.length ? yf[yf.length - 1].t : 0;
  for (const k of [...st.live.keys()]) if (k <= yfLast) st.live.delete(k);
  const live = [...st.live.values()].sort((a, b) => a.t - b.t);
  st.data.bars = yf.concat(live);
}
async function liveTick(){
  if (st.demo || !S.worker || st.liveBusy || document.visibilityState !== 'visible') return;
  st.liveBusy = true;
  try {
    const m = await api('/gex/NQ_NDX/classic/gex_zero/majors');
    const ts = Number.isFinite(m.timestamp) ? m.timestamp : Date.now() / 1000;
    let px = m.spot;
    if (!Number.isFinite(px)) throw new Error('majors bez spot');
    // NQ_NDX should be in NQ terms; if it is NDX index, shift by basis vs futures
    const yfLast = st.yf && st.yf.length ? st.yf[st.yf.length - 1].c : NaN;
    if (Number.isFinite(yfLast) && Math.abs(px - yfLast) > 40) {
      if (!Number.isFinite(st.basis) || Math.abs(px + st.basis - yfLast) > 40) st.basis = yfLast - px;
      px += st.basis;
    }
    st.liveAge = Date.now() / 1000 - ts;
    if (st.liveAge > 120) { st.liveSrc = 'stale'; showSrc(); return; }
    st.liveSrc = 'live';
    const k = Math.floor(ts / 60) * 60;
    const b = st.live.get(k);
    if (b) { b.h = Math.max(b.h, px); b.l = Math.min(b.l, px); b.c = px; }
    else st.live.set(k, { t:k, o:px, h:px, l:px, c:px, v:0 });
    mergeBars();
    if (st.data.bars.length) {
      st.res = A.compute(st.data, S);
      render();
      checkAlerts();
      showSrc();
    }
  } catch (e) {
    st.liveSrc = 'err';
    showSrc(e.message);
  } finally { st.liveBusy = false; }
}
function showSrc(err){
  const el = $('src');
  if (st.demo) { el.textContent = 'DEMO'; el.className = 'badge'; return; }
  if (st.liveSrc === 'live') { el.textContent = `LIVE ${Math.max(0, Math.round(st.liveAge))}s`; el.className = 'badge pos'; }
  else if (st.liveSrc === 'stale') {
    const ts = st.res && st.res.gexTs;
    const when = ts ? new Date(ts * 1000).toLocaleString('cs-CZ', { weekday:'short', hour:'2-digit', minute:'2-digit' }) : '?';
    el.textContent = `GEX z ${when} · trh zavřen · Yahoo`;
    el.className = 'badge neg';
  }
  else { el.textContent = 'Yahoo ~10 min'; el.className = 'badge'; if (err) el.title = err; }
}
async function loadDaily(){
  const want = S.volIndex || 'VXN';
  const [d,v] = await Promise.all([
    api('/yf/NQ%3DF?interval=1d&range=6mo'),
    api(`/yf/%5E${want}?interval=1d&range=1mo`)
      .then(j => { st.volSym = want; return j; })
      .catch(() => api('/yf/%5EVIX?interval=1d&range=1mo').then(j => { st.volSym = 'VIX'; return j; })), // fallback
  ]);
  st.data.daily = A.parseYF(d); st.data.vix = A.parseYF(v);
}
async function loadGex(){
  const L = S.layers, jobs = {};
  if (L.gex0 || L.maxchg) jobs.zero = api('/gex/NQ_NDX/classic/gex_zero');
  if (L.gex1) jobs.one = api('/gex/NQ_NDX/classic/gex_one');
  if (L.gexFull) jobs.full = api('/gex/NQ_NDX/classic/gex_full');
  if (L.qqq || L.qqqMain) jobs.qqq = api('/gex/QQQ/classic/gex_full');
  if (L.maxchg) jobs.mx = api('/gex/NQ_NDX/classic/gex_zero/maxchange');
  const keys = Object.keys(jobs);
  const res = await Promise.allSettled(keys.map(k => jobs[k]));
  const g = {}, errs = [];
  res.forEach((r,i) => r.status === 'fulfilled' ? (g[keys[i]] = r.value) : errs.push(r.reason.message));
  st.data.gex = g;
  return errs;
}

// previous session snapshot (from Worker KV) — orientation only
async function loadPrev(){
  const z = st.data.gex.zero || st.data.gex.full;
  const before = z && Number.isFinite(z.timestamp)
    ? new Intl.DateTimeFormat('en-CA', { timeZone:'America/New_York' }).format(new Date(z.timestamp * 1000))
    : new Intl.DateTimeFormat('en-CA', { timeZone:'America/New_York' }).format(new Date());
  if (st.prev && st.prev.before === before && Date.now() - st.prev.at < 30 * 60e3) return;
  const get = c => api(`/prev/NQ_NDX/${c}?before=${before}`).catch(() => null);
  const [zr, fr] = await Promise.all([get('gex_zero'), get('gex_full')]);
  st.prev = { before, at: Date.now(), date: (zr && zr.date) || (fr && fr.date) || null,
    zero: zr && zr.data, full: fr && fr.data };
}

async function refresh(full){
  if (st.busy) return;
  st.busy = true;
  try {
    let errs = [];
    if (!st.demo) {
      if (!S.worker) { renderEmpty(); return; }
      const jobs = [loadBars()];
      if (full || st.tick % 2 === 0) jobs.push(loadGex().then(e => { errs = e; }));
      if (full || st.tick % 20 === 0 || !st.data.daily.length || !st.data.vix.length) jobs.push(loadDaily().catch(e => errs.push(e.message)));
      await Promise.all(jobs);
      if (S.showPrev) await loadPrev().catch(() => {});
    }
    st.res = A.compute(st.data, S);
    render();
    setLive(errs.length ? 'err' : 'ok', errs.length ? 'částečně: ' + errs.join(', ') : null);
    if (!st.demo) checkAlerts();
  } catch (e) {
    setLive('err', e.message);
    if (!st.res) renderEmpty(e.message);
  } finally { st.busy = false; st.tick++; }
}

function setLive(cls, msg){
  $('live').className = 'dotlive ' + cls;
  const t = new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('upd').textContent = (st.demo ? 'DEMO · ' : '') + (msg ? msg : 'aktualizováno ' + t);
}

// ───────── render
function chipClass(t){
  if (/ΔGEX/.test(t)) return 'chg';
  if (/^QQQ/.test(t)) return 'qqq';
  if (/ZG/.test(t)) return 'zg';
  if (/CW/.test(t)) return 'call';
  if (/PW/.test(t)) return 'put';
  if (/^EM|^σ/.test(t)) return 'vol';
  if (/POC|VAH|VAL/.test(t)) return 'vp';
  return '';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const r = st.res; if (!r) return;
  const b = st.data.bars;
  // candles: today's session + tail of previous
  const out = []; let prev = -Infinity;
  for (const x of b.slice(-1400)) {
    const t = A.et(x.t).disp;
    const bar = { time:t, open:x.o, high:x.h, low:x.l, close:x.c };
    if (t === prev) { out[out.length - 1] = bar; continue; } // same minute: keep the newest (partial) bar
    if (t < prev) continue;
    prev = t; out.push(bar);
  }
  const ts = chart.timeScale();
  const atEdge = !fitted || ts.scrollPosition() > -3; // follow the newest bar unless the user scrolled back
  series.setData(out);
  if (!fitted && out.length) { ts.setVisibleLogicalRange({from:out.length-240,to:out.length+8}); fitted = true; }
  else if (atEdge) ts.scrollToRealTime();

  // price lines
  st.lines.forEach(l => series.removePriceLine(l)); st.lines = [];
  for (const l of r.levels) {
    const col = l.dir < 0 ? '#f05a6e' : l.dir > 0 ? '#2fc59f' : '#c9a66b';
    const strong = l.score >= 5;
    st.lines.push(series.createPriceLine({
      price:l.price, color: strong ? col : col + '99', lineWidth: l.score >= 7 ? 2 : 1,
      lineStyle: strong ? 0 : 2, axisLabelVisible: strong,
      title: `${l.score} ${l.tags[0]}${l.tags.length > 1 ? ' +' + (l.tags.length-1) : ''}`,
    }));
  }
  // major QQQ walls (0/5 strikes): thick gold line + weak/strong zone edges
  for (const m of (r.info.majors || [])) {
    const name = (m.type === 'CW' ? 'CW ' : 'PW ') + m.qqq;
    st.lines.push(series.createPriceLine({ price:m.price, color:'#c9a66b', lineWidth:3, lineStyle:0, axisLabelVisible:true, title:'★ QQQ ' + name }));
    for (const e of [m.strong, -m.strong]) st.lines.push(series.createPriceLine({ price:m.price + e, color:'#c9a66b88', lineWidth:1, lineStyle:2, axisLabelVisible:false, title:'' }));
    for (const e of [m.weak, -m.weak]) st.lines.push(series.createPriceLine({ price:m.price + e, color:'#c9a66b44', lineWidth:1, lineStyle:1, axisLabelVisible:false, title:'' }));
  }
  // yesterday's options levels: grey dotted, orientation only
  const pv = (S.showPrev && st.prev && !st.demo) ? A.prevLevels(st.prev, r.last, S) : [];
  for (const l of pv) {
    st.lines.push(series.createPriceLine({
      price:l.price, color:'#8b919a', lineWidth:1, lineStyle:1, axisLabelVisible:false,
      title:`Y ${l.tags[0]}${l.tags.length > 1 ? ' +' + (l.tags.length-1) : ''}`,
    }));
  }

  // header + meta
  $('px').textContent = fmtP(r.last);
  const rg = $('regime');
  rg.className = 'badge ' + (r.regime > 0 ? 'pos' : r.regime < 0 ? 'neg' : '');
  rg.textContent = r.regime > 0 ? '+γ · fade' : r.regime < 0 ? '−γ · trend' : 'γ —';
  const i = r.info;
  $('mEm').textContent = i.em
    ? `±${i.em.em.toFixed(0)} · Ref ${fmtP(i.em.anchor)} (${st.volSym || 'VXN'} ${i.em.vix.toFixed(2)}${S.emStraddle === false ? '' : ' ×0.8'}${st.volSym && st.volSym !== (S.volIndex || 'VXN') ? ' ⚠ náhradní' : ''}, RTH open ${i.em.date.slice(5).split('-').reverse().join('.')}${i.em.fromPrev ? ' – platí do 9:30' : ''})`
    : '—';
  $('mSig').textContent = i.sigma ? `${i.sigma.pts.toFixed(0)} b.` : '—';
  $('mPoc').textContent = i.vp ? fmtP(i.vp.poc) : '—';
  $('mRatio').textContent = i.ratio ? i.ratio.toFixed(2) : '—';
  $('majors').innerHTML = (i.majors || []).map(m => {
    const z = majorZone(m, r.last), d = m.price - r.last;
    const zt = z === 'strong' ? 'V SILNÉ ZÓNĚ' : z === 'weak' ? 've slabé zóně' : `${d > 0 ? '+' : ''}${d.toFixed(0)} b.`;
    return `<div class="mj ${m.type.toLowerCase()} ${z}"><span class="t">★ ${m.type === 'CW' ? 'CALL WALL' : 'PUT WALL'}</span>
      <b>QQQ ${m.qqq}</b><span>→ ${fmtP(m.price)}</span><span class="z">${zt}</span></div>`;
  }).join('');

  // list
  let lv = r.levels;
  if (st.filter === 'near') lv = lv.filter(l => Math.abs(l.dist) <= 100);
  if (st.filter === 'opt') lv = lv.filter(l => l.srcs.includes('opt') || l.srcs.includes('qqq'));
  if (st.filter === 'fresh') lv = lv.filter(l => l.status.key === 'untested');
  let html = '', pxDone = false;
  if (!lv.length) html = '<div class="empty">Žádné levely pro tento filtr.</div>';
  for (const l of lv) {
    if (!pxDone && l.price < r.last) { html += `<div class="pxrow">NQ ${fmtP(r.last)}</div>`; pxDone = true; }
    const key = l.price.toFixed(2);
    const near = Math.abs(l.dist) <= S.alertDist;
    const dir = l.dir < 0 ? ['s','▼ Short'] : l.dir > 0 ? ['l','▲ Long'] : ['a','● U ceny'];
    const shown = l.tags.slice(0,3).map(t => `<span class="chip ${chipClass(t)}">${esc(t)}</span>`).join('');
    const extra = l.tags.length > 3 ? `<span class="chip">+${l.tags.length-3}</span>` : '';
    const evs = l.events.map(e => `${e.type} ${A.hhmm(e.t)}`).join(' · ') || 'dnes bez dotyku';
    html += `<div class="row${near ? ' near' : ''}${st.open.has(key) ? ' open' : ''}" data-k="${key}">
      <div class="p">${fmtP(l.price)}</div>
      <div class="chips">${shown}${extra}</div>
      <div class="sc"><b>${l.score}</b></div>
      <div class="dir ${dir[0]}">${dir[1]}</div>
      <div class="dist">${l.dist > 0 ? '+' : ''}${l.dist.toFixed(1)} b.</div>
      <div class="st ${l.status.key}"><i></i>${esc(l.status.text)}</div>
      <div class="more">Tagy: ${l.tags.map(esc).join(', ')}<br>Události: ${esc(evs)}${r.regime < 0 ? '<br>−γ režim: fade jen s potvrzením, počítej s průrazem.' : ''}</div>
    </div>`;
  }
  if (!pxDone && lv.length) html += `<div class="pxrow">NQ ${fmtP(r.last)}</div>`;

  // yesterday section
  if (S.showPrev && !st.demo) {
    const d = st.prev && st.prev.date;
    html += `<div class="prevhd">Včerejší levely${d ? ' · ' + d : ''} <span>jen orientace, nepočítají se do skóre</span></div>`;
    if (!pv.length) {
      html += `<div class="empty">${st.prev ? 'Zatím žádný snapshot. Worker ho uloží po dnešním close (nebo spusť /snap).' : 'Načítám…'}</div>`;
    }
    let pxd = false;
    for (const l of pv) {
      if (!pxd && l.price < r.last) { html += `<div class="pxrow dim">NQ ${fmtP(r.last)}</div>`; pxd = true; }
      html += `<div class="row prev">
        <div class="p">${fmtP(l.price)}</div>
        <div class="chips">${l.tags.slice(0,3).map(t => `<span class="chip">${esc(t)}</span>`).join('')}${l.tags.length > 3 ? `<span class="chip">+${l.tags.length-3}</span>` : ''}</div>
        <div class="sc">${l.score}</div>
        <div class="dist" style="grid-column:2/4">${l.dist > 0 ? '+' : ''}${l.dist.toFixed(1)} b.</div>
      </div>`;
    }
  }
  $('list').innerHTML = html;
}

function renderEmpty(err){
  $('list').innerHTML = `<div class="empty">${err ? 'Chyba: ' + esc(err) + '<br><br>' : ''}
    Nastav URL Workeru a token v ⚙, nebo si nejdřív prohlédni demo.<br>
    <button id="eSet">Otevřít nastavení</button> <button id="eDemo">Demo data</button></div>`;
  $('eSet').onclick = openSettings; $('eDemo').onclick = startDemo;
}

// ───────── alerts
function beep(){
  try{
    const a = st.audio; if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(.18, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .35);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .36);
  }catch(e){}
}
function toast(msg, major){ const t = $('toast'); t.textContent = msg; t.classList.toggle('major', !!major); t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 6000); }
// zone of the price relative to a major wall: 'strong' (±10 NQ), 'weak' (±0.5 QQQ) or 'out'
function majorZone(m, last){
  const d = Math.abs(last - m.price);
  return d <= m.strong ? 'strong' : d <= m.weak ? 'weak' : 'out';
}
function checkMajorAlerts(){
  const r = st.res; if (!r || !S.majorAlerts) return;
  const now = Date.now();
  for (const m of (r.info.majors || [])) {
    const key = m.type + m.qqq;
    const z = majorZone(m, r.last);
    const prev = st.majorZone[key] || 'out';
    st.majorZone[key] = z;
    const rank = { out:0, weak:1, strong:2 };
    if (rank[z] <= rank[prev]) continue;               // alert only when entering a deeper zone
    const ak = key + z;
    if (st.alerted[ak] && now - st.alerted[ak] < 5 * 60e3) continue;
    st.alerted[ak] = now;
    const name = m.type === 'CW' ? 'CALL WALL' : 'PUT WALL';
    const msg = `★ ${name} QQQ ${m.qqq} → NQ ${fmtP(m.price)} · ${z === 'strong' ? 'SILNÁ zóna ±' + m.strong + ' b.' : 'slabá zóna ±' + m.weak.toFixed(0) + ' b.'} · NQ ${fmtP(r.last)}`;
    toast(msg, true); beep(); if (z === 'strong') setTimeout(beep, 220);
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification('★ ' + name, { body:msg, requireInteraction: z === 'strong' }); } catch(e){}
  }
}

function checkAlerts(){
  checkMajorAlerts();
  const r = st.res; if (!r) return;
  const now = Date.now();
  for (const l of r.levels) {
    if (l.score < S.alertScore || Math.abs(l.dist) > S.alertDist) continue;
    const k = Math.round(l.price);
    if (st.alerted[k] && now - st.alerted[k] < 10 * 60e3) continue;
    st.alerted[k] = now;
    const dir = l.dir < 0 ? 'SHORT' : l.dir > 0 ? 'LONG' : '';
    const msg = `NQ ${fmtP(r.last)} → ${fmtP(l.price)} ${dir} · skóre ${l.score} · ${l.tags.slice(0,3).join(', ')}`;
    toast(msg); beep();
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Algo level', { body:msg }); } catch(e){}
  }
}

// ───────── settings UI
function openSettings(){
  $('sWorker').value = S.worker; $('sToken').value = S.token;
  $('sTol').value = S.tol; $('sMin').value = S.minScore; $('sRange').value = S.range;
  $('sTouch').value = S.touch; $('sBrk').value = S.brk; $('sReact').value = S.react; $('sLook').value = S.lookahead;
  $('sRTH').checked = S.scanRTH; $('sPrev').checked = S.showPrev; $('sVol').value = S.volIndex || 'VXN'; $('sStr').checked = S.emStraddle !== false; $('sAD').value = S.alertDist; $('sAS').value = S.alertScore; $('sMS').value = S.majorStrong; $('sMA').checked = S.majorAlerts;
  $('layers').innerHTML = LAYERS.map(([k,n]) => `<label class="cb"><input type="checkbox" data-l="${k}" ${S.layers[k] ? 'checked' : ''}> ${n}</label>`).join('');
  $('settings').classList.add('show');
}
function num(id, d){ const v = parseFloat($(id).value); return Number.isFinite(v) ? v : d; }
$('bSave').onclick = () => {
  const wasWorker = S.worker;
  S.worker = $('sWorker').value.trim(); S.token = $('sToken').value.trim();
  S.tol = num('sTol',S.tol); S.minScore = num('sMin',S.minScore); S.range = num('sRange',S.range);
  S.touch = num('sTouch',S.touch); S.brk = num('sBrk',S.brk); S.react = num('sReact',S.react);
  S.lookahead = Math.max(1, Math.round(num('sLook',S.lookahead)));
  const volChanged = S.volIndex !== $('sVol').value;
  S.scanRTH = $('sRTH').checked; S.showPrev = $('sPrev').checked; S.volIndex = $('sVol').value; S.emStraddle = $('sStr').checked;
  if (volChanged) st.data.vix = []; S.alertDist = num('sAD',S.alertDist); S.alertScore = num('sAS',S.alertScore); S.majorStrong = num('sMS',S.majorStrong); S.majorAlerts = $('sMA').checked;
  document.querySelectorAll('#layers input').forEach(c => S.layers[c.dataset.l] = c.checked);
  save();
  $('settings').classList.remove('show');
  if (S.worker && (st.demo || S.worker !== wasWorker)) {
    st.demo = false; st.data = {bars:[],daily:[],vix:[],gex:{}}; st.yf = []; st.live.clear(); st.basis = NaN; fitted = false;
  }
  refresh(true);
};
$('bClose').onclick = () => $('settings').classList.remove('show');
$('settings').onclick = e => { if (e.target.id === 'settings') $('settings').classList.remove('show'); };
$('bAlerts').onclick = async () => {
  try { st.audio = st.audio || new (window.AudioContext || window.webkitAudioContext)(); await st.audio.resume(); beep(); } catch(e){}
  try { if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); } catch(e){}
  toast('Alerty zapnuté (zvuk + notifikace, pokud je prohlížeč povolí).');
};
$('bDemo').onclick = () => { $('settings').classList.remove('show'); startDemo(); };
$('gear').onclick = openSettings;

function startDemo(){ st.demo = true; st.live.clear(); st.yf = []; st.data = A.makeDemo(Date.now() % 100000); fitted = false; showSrc(); refresh(true); }

document.querySelectorAll('.tabs button[data-f]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button[data-f]').forEach(x => x.classList.toggle('on', x === b));
  st.filter = b.dataset.f; render();
});

// ───────── export for the TradingView "Algo Levels" Pine indicator
function tvString(){
  const r = st.res; if (!r) return '';
  return r.levels.map(l => `${l.price};${l.score};${l.tags.join('/').replace(/[;|]/g, '')}`).join('|');
}
$('bTV').onclick = async () => {
  const s = tvString();
  if (!s) { toast('Zatím nejsou levely.'); return; }
  let ok = false;
  try { await navigator.clipboard.writeText(s); ok = true; } catch(e){}
  if (!ok) {
    const ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove();
  }
  toast(ok ? `Zkopírováno ${st.res.levels.length} levelů → vlož do indikátoru Algo Levels v TradingView.` : 'Kopírování selhalo.');
};
$('list').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  const k = row.dataset.k;
  st.open.has(k) ? st.open.delete(k) : st.open.add(k);
  row.classList.toggle('open');
});

// ───────── go
if (S.worker) refresh(true); else renderEmpty();
setInterval(() => { if (!st.demo && document.visibilityState === 'visible') refresh(false); }, 30000);
setInterval(liveTick, 5000);
showSrc();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !st.demo) refresh(true); });
})();
</script>
</body>
</html>
